# ZhuWei-RASP agent settings.
# Each key can be overridden by -Drasp.<key>=..., env RASP_<KEY> (dots -> underscores, upper case),
# or agent args: -javaagent:rasp-launcher.jar=app.name=order;app.env=test

# Management server. Leave empty for standalone mode (alarms only in logs/alarm.log, policy from conf/policy.json).
server.url=
app.key=
app.secret=

# Policy signing public key(s) from the server (rasp-sign.key.pub, base64 SPKI; comma-separate several
# keys during rotation). When set, configs whose signature does not verify are rejected.
policy.public_key=
# Default: required iff policy.public_key is set.
#policy.require_signature=true

app.name=unknown-app
app.env=prod

log.level=INFO
log.max_size_mb=50
report.queue_size=2000

# Write instrumented classes to <home>/dump for inspection with javap.
debug.dump=false

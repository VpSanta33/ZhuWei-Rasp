name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and unit-test the agent (JDK 11 bytecode)
        run: mvn -B clean package
        working-directory: agent-java

  agent-compat:
    # The agent is compiled for Java 8; run the smoke test (agent start-up, javax.servlet hook, async
    # context, dynamic attach/detach) on every supported long-term JDK.
    needs: agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build agent and compat app
        run: mvn -B -q clean package -DskipTests
        working-directory: agent-java
      - name: Assemble agent directory
        run: |
          mkdir -p rasp/conf rasp/tools rasp/logs
          cp agent-java/rasp-launcher/target/rasp-launcher.jar agent-java/rasp-bootstrap/target/rasp-bootstrap.jar agent-java/rasp-core/target/rasp-core.jar rasp/
          cp deploy/agent-conf/* rasp/conf/
          cp deploy/tools/*.sh rasp/tools/
      - uses: actions/setup-java@v4
        id: runtime
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Smoke test on JDK ${{ matrix.java }}
        run: JAVA="${{ steps.runtime.outputs.path }}/bin/java" agent-java/compat-app/smoke-test.sh rasp agent-java/compat-app/target/compat-app.jar

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t zhuwei-rasp-server:ci server/
      - name: Image starts and answers health checks
        run: |
          docker run -d --name rasp -p 8480:8480 -e RASP_ADMIN_PASSWORD=ci-admin-password zhuwei-rasp-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8480/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8480/healthz
          curl -fsS -X POST http://127.0.0.1:8480/api/v1/login -d '{"username":"admin","password":"ci-admin-password"}' | grep -q '"token"'
          docker logs rasp

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build console (type check + bundle)
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: server/web
      - name: Vet and test
        run: go vet ./... && go test ./...
        working-directory: server
      - name: Browser end-to-end tests against the real Go server
        run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: server/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: server/web/test-results
